name: CI

# CI Strategy:
# - Tests run on Linux, macOS, and Windows (cross-platform 2D library)
# - Go 1.25+ required (matches go.mod requirement)
# - CGO_ENABLED=0: the build users ship is pure Go (goffi's fakecgo path)
# - Race detection: the toolchain's -race with CGO_ENABLED=1 on that step only
#
# Branch Strategy (GitHub Flow):
# - main branch: Production-ready code
# - Feature branches: Tested via pull_request trigger
# - Pull requests: Must pass all checks before merge ("Required checks" below)

env:
  CGO_ENABLED: "0"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Build verification - Cross-platform
  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.25']

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Build all packages
      run: go build ./...

    - name: Build examples
      run: go build ./examples/...

    - name: Build demo
      run: go build ./cmd/ggdemo

  # Unit tests - Cross-platform
  test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.25']

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Run go vet
      if: matrix.os == 'ubuntu-latest'
      run: go vet ./...

    # The build users ship: CGO_ENABLED=0, GPU code included, so goffi runs its
    # fakecgo path and the GPU packages run against wgpu's software and noop
    # backends.
    - name: Run tests
      shell: bash
      run: go test -v -count=1 -coverprofile=coverage.txt -covermode=atomic ./...

    # Race detection uses the toolchain's -race (ThreadSanitizer, needs cgo).
    # A pure-Go detector in the runtime is proposed in golang/go#76786; an external
    # source-level instrumenter can't see the runtime, the standard library or
    # dependencies, so we don't use one in CI.
    # With CGO_ENABLED=1 goffi links the real runtime/cgo instead of its fakecgo,
    # so this step tests that path, not the one above. A non-std cgo package in
    # the test binary would fail to link here on Linux (goffi#72).
    - name: Run tests with the race detector
      shell: bash
      env:
        CGO_ENABLED: "1"
      run: go test -race -count=1 ./...

    - name: Verify coverage file
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: ls -la coverage.txt && echo "$(wc -l < coverage.txt) lines"

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.txt
        flags: unittests
        name: codecov-gg
        fail_ci_if_error: true

  # GPU golden tests - Linux with Mesa software Vulkan (lavapipe)
  # Follows wgpu CI pattern: install Mesa drivers, run GPU code on llvmpipe.
  # Tests render same scene on CPU and GPU, compare output (Vello compare pattern).
  # Non-blocking: failures produce warnings, not CI failures.
  gpu-golden:
    name: GPU Golden Tests (Mesa/lavapipe)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25'
        cache: true

    - name: Install Mesa for GPU testing
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          mesa-vulkan-drivers \
          libegl-mesa0 \
          libgl1-mesa-dri

    - name: Verify Mesa installation
      run: |
        echo "=== Vulkan ICD files ==="
        ls -la /usr/share/vulkan/icd.d/ 2>/dev/null || echo "No Vulkan ICD files found"
        echo ""
        echo "=== Mesa libraries ==="
        ldconfig -p | grep -E 'vulkan|mesa' | head -10 || true

    - name: Download dependencies
      run: go mod download

    - name: Run GPU golden tests
      env:
        # Force software rendering via lavapipe
        LIBGL_ALWAYS_SOFTWARE: "1"
        MESA_LOADER_DRIVER_OVERRIDE: "lvp"
        VK_ICD_FILENAMES: "/usr/share/vulkan/icd.d/lvp_icd.x86_64.json"
      run: |
        echo "=== Running GPU vs CPU golden comparison tests ==="
        go test -v -count=1 -run 'TestGoldenSoftware' -timeout 5m ./internal/gpu/... || {
          echo "::warning::GPU golden tests failed (non-blocking — software adapter differences expected)"
          exit 0
        }

  # Linting
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25'
        cache: true

    # The pinned golangci-lint (version and sha256 live in the action) comes
    # from the Actions cache, so lint does not depend on GitHub Releases being
    # reachable on every run; on 2026-11-08 the release download URL returned
    # 504 for over an hour. Bump golangci-lint in gogpu/.github, then move this
    # pin. Keep lint-targets on the same commit.
    - name: Set up golangci-lint
      uses: gogpu/.github/actions/setup-golangci-lint@cdb7bd4a5bd3852541a05f0fa1fa92b09d1ee732 # main 2026-11-08, golangci-lint v2.15.0

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        install-mode: none
        args: --timeout=5m

  # Lint for the other desktop targets. golangci-lint type-checks only the
  # files the target's build compiles, so the darwin and windows files are
  # never linted by the Linux job above. The code is pure Go (CGO_ENABLED=0),
  # so GOOS/GOARCH on a Linux runner select exactly those files, with no need
  # for slower macOS or Windows runners. A file that does not type-check makes
  # golangci-lint exit non-zero, so a broken target cannot pass as "0 issues".
  # One GOARCH per GOOS is enough: no file in the module is arch-specific, and
  # none is built for js/wasm.
  lint-targets:
    name: Lint - ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25'
        cache: true

    - name: Set up golangci-lint
      uses: gogpu/.github/actions/setup-golangci-lint@cdb7bd4a5bd3852541a05f0fa1fa92b09d1ee732 # main 2026-11-08, golangci-lint v2.15.0

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      with:
        install-mode: none
        args: --timeout=5m

  # Code formatting check
  formatting:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25'
        cache: true

    - name: Check formatting
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "ERROR: The following files are not formatted:"
          gofmt -l .
          echo ""
          echo "Run 'go fmt ./...' to fix formatting issues."
          exit 1
        fi
        echo "All files are properly formatted"

  # Dependency freshness check
  # Uses go-mod-outdated (https://github.com/psampaz/go-mod-outdated)
  # Non-blocking: reports outdated deps as warnings, does not fail CI
  deps:
    name: Dependencies
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25'
        cache: true

    # go-mod-outdated is pinned in tools/go.mod (checksums in tools/go.sum,
    # updated by Dependabot), never installed @latest.
    - name: Check direct dependencies for updates
      run: |
        echo "## Direct Dependencies with Updates"
        OUTDATED=$(go list -u -m -json all 2>/dev/null | go tool -modfile=tools/go.mod go-mod-outdated -update -direct || true)
        if [ -n "$OUTDATED" ]; then
          echo "$OUTDATED"
          echo "::warning::Some direct dependencies have updates available"
        else
          echo "All direct dependencies are up to date!"
        fi

    - name: Check ecosystem dependencies
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "## Ecosystem Dependencies"
        WARNINGS=0

        check_dep() {
          local DEP=$1 REPO=$2
          LOCAL=$(grep "$DEP" go.mod 2>/dev/null | grep -v "^module" | awk '{print $2}')
          [ -z "$LOCAL" ] && return 0

          LATEST=$(gh release view --repo "$REPO" --json tagName -q '.tagName' 2>/dev/null || echo "")
          [ -z "$LATEST" ] && { echo "⚠️  $DEP: $LOCAL (cannot verify)"; return 0; }

          if [ "$LOCAL" = "$LATEST" ]; then
            echo "✅ $DEP: $LOCAL"
          else
            echo "❌ $DEP: $LOCAL → $LATEST available"
            WARNINGS=$((WARNINGS + 1))
          fi
        }

        check_dep "github.com/gogpu/wgpu" "gogpu/wgpu"
        check_dep "github.com/gogpu/naga" "gogpu/naga"

        [ $WARNINGS -gt 0 ] && echo "::warning::$WARNINGS ecosystem dep(s) outdated"
        exit 0

    - name: Verify go.mod is tidy
      run: |
        go mod tidy
        go -C tools mod tidy
        if ! git diff --exit-code go.mod go.sum tools/go.mod tools/go.sum; then
          echo "::error::go.mod/go.sum or tools/go.mod/go.sum are not tidy — run 'go mod tidy' (and in tools/) and commit"
          exit 1
        fi

    - name: Verify no forbidden dependencies
      run: |
        FORBIDDEN="github.com/gogpu/gogpu github.com/gogpu/ui"
        FOUND=0
        for m in $FORBIDDEN; do
          if go list -m all 2>/dev/null | grep -q "^$m "; then
            echo "::error::Forbidden dependency $m found in module graph (gg must not depend on gogpu or ui)"
            FOUND=1
          fi
        done
        exit $FOUND

  # The one check the main-protection ruleset requires. Every job that must
  # pass goes into needs, so adding a job or a matrix entry never touches the
  # ruleset. if: always() and the explicit result check are both needed: a job
  # skipped because a job it needs failed or was cancelled counts as passed
  # for a required check, so without them a red PR could go green.
  required:
    name: Required checks
    if: always()
    needs: [build, test, gpu-golden, lint, lint-targets, formatting, deps]
    runs-on: ubuntu-latest

    steps:
    - name: Every required job succeeded
      env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "results: $RESULTS"
        for r in $RESULTS; do
          if [ "$r" != success ]; then
            echo "::error::a required job ended with: $r"
            exit 1
          fi
        done
